<main class="resume">
  <app-header
    [fullName]="fullName"
    [email]="email"
    [phone]="phone"
    [date]="date"
    [profile]="profile"
    [section]="section" />

  <app-profile-card />

  <app-skills
    [skills]="skills"
    (skillSelected)="onSkillSelected($event)" />

  <section class="interaction">
    <h2 class="section-title">A Little Interaction</h2>
    <p aria-live="polite">{{ message }}</p>
  </section>

  <app-footer [fullName]="fullName" [proficiencies]="proficiencies" />
</main>
