<header class="intro">
  <div class="ornament" aria-hidden="true">✦ ✧ ✦</div>
  <p class="eyebrow">PERSONAL CURRICULUM VITAE</p>
  <h1>{{ fullName() }}</h1>
  <p class="student-info">{{ section() }} <span>•</span> STUDENT PROFILE</p>
  <div class="contact-info">
    <span>✉ {{ email() }}</span>
    <span>☎ {{ phone() }}</span>
    <span>◷ {{ date() }}</span>
  </div>
  <div class="gold-line"></div>
</header>

<section class="profile-section">
  <h2 class="section-title">Personal Profile</h2>
  <p>{{ profile() }}</p>
</section>
